<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR Code 產生器（教師用）</title>
<style>
  :root{
    --bg:#f4f5f8; --card:#fff; --ink:#16181d; --muted:#6b7280; --line:#e4e6eb;
    --field:#fbfbfd; --accent:#4f46e5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1014; --card:#171a20; --ink:#f2f3f5; --muted:#9aa1ad; --line:#2a2e37; --field:#1f232b; --accent:#818cf8; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink); padding:28px 16px 60px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  .wrap{ max-width:900px; margin:0 auto; }
  h1{ font-size:24px; margin:0 0 6px; letter-spacing:-.01em; }
  .lead{ color:var(--muted); margin:0 0 24px; font-size:14.5px; line-height:1.6; }
  .grid{ display:grid; grid-template-columns:minmax(280px,1fr) minmax(260px,340px); gap:22px; align-items:start; }
  @media (max-width:720px){ .grid{ grid-template-columns:1fr; } }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; }
  label{ display:block; margin-bottom:15px; }
  .lbl{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .hint{ display:block; font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5; }
  input,select{
    width:100%; font:inherit; font-size:15px; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--field); color:var(--ink);
  }
  input:focus,select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .row{ display:flex; gap:12px; } .row>*{ flex:1; }
  .qrbox{ text-align:center; }
  #qr{ display:inline-flex; padding:16px; background:#fff; border-radius:14px; border:1px solid var(--line); }
  #qr img,#qr canvas{ display:block; }
  .url{
    margin-top:14px; font-size:12px; color:var(--muted); word-break:break-all;
    background:var(--field); border:1px solid var(--line); border-radius:10px; padding:10px; text-align:left; line-height:1.5;
  }
  .btns{ display:flex; gap:10px; margin-top:14px; }
  button{
    flex:1; font:inherit; font-size:14.5px; font-weight:600; padding:11px; border-radius:10px;
    border:1px solid var(--line); background:var(--field); color:var(--ink); cursor:pointer;
  }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  button:hover{ filter:brightness(1.06); }

  .rotate{ margin-top:12px; font-size:12.5px; color:var(--muted); }
  .rotate .bar, .p-rotate .bar{
    height:5px; border-radius:999px; background:var(--line); overflow:hidden; margin-bottom:6px;
  }
  .rotate .bar i, .p-rotate .bar i{
    display:block; height:100%; background:var(--accent); border-radius:999px;
    width:100%; transition:width .25s linear;
  }
  .static-note{
    margin-top:12px; font-size:12.5px; line-height:1.5; color:#9a3412;
    background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:9px 11px;
  }
  @media (prefers-color-scheme: dark){
    .static-note{ color:#fed7aa; background:#2b1c10; border-color:#7c2d12; }
  }
  .p-rotate{ width:min(520px,70vw); font-size:clamp(13px,1.5vw,20px); color:#555; text-align:center; }
  .p-rotate .bar{ height:8px; background:#e5e5e5; }
  .p-rotate .bar i{ background:#111; }

  /* 投影全螢幕模式 */
  #project{
    position:fixed; inset:0; background:#fff; color:#111; z-index:50;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:4vh;
  }
  #project.on{ display:flex; }
  #project h2{ font-size:clamp(28px,5vw,64px); margin:0; text-align:center; }
  #project p{ font-size:clamp(15px,2vw,26px); color:#555; margin:0; text-align:center; }
  #projectQr{ padding:20px; background:#fff; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,.12); }
  #project .close{ position:fixed; top:16px; right:16px; flex:none; padding:10px 18px; background:#eee; color:#111; border-color:#ddd; }
</style>
</head>
<body>
<div class="wrap">
  <h1>QR Code 產生器</h1>
  <p class="lead">選好模式後投影右邊的 QR Code，全班同步掃描即可簽到。網址與參數都在下方顯示，可直接複製。</p>

  <div class="grid">
    <div class="panel">
      <label>
        <span class="lbl">簽到模式</span>
        <select id="mode">
          <option value="attendance">點名簽到（attendance）</option>
          <option value="classBonus">課堂加分（classBonus）</option>
          <option value="lectureBonus">講座加分（lectureBonus）</option>
        </select>
      </label>

      <label>
        <span class="lbl">前端網頁網址</span>
        <input type="text" id="site" placeholder="https://your-site.vercel.app/">
        <span class="hint">學生掃描後會開啟的網頁。預設帶入目前這頁的位置。</span>
      </label>

      <div class="row">
        <label>
          <span class="lbl">場次代碼 session</span>
          <input type="text" id="session" placeholder="例如 0911-第三節">
          <span class="hint">填了就能防止同一人重複加分。</span>
        </label>
        <label>
          <span class="lbl">分數 points</span>
          <input type="number" id="points" min="1" max="10" placeholder="1">
          <span class="hint">加分模式專用，預設 1 分。</span>
        </label>
      </div>

      <label>
        <span class="lbl">輪替密語（防截圖轉傳）</span>
        <input type="password" id="secret" placeholder="與 setRotateSecret() 設定的同一串" autocomplete="off">
        <span class="hint">
          填了之後 QR 每 30 秒換一次，舊的碼後端會拒絕，學生截圖傳給別人也沒用。<br>
          密語只存在這台電腦的瀏覽器，不會進 QR、不會上傳、學生看不到。
        </span>
      </label>

      <label>
        <span class="lbl">通行碼 token（選填）</span>
        <input type="text" id="token" placeholder="與 Code.gs 的 CONFIG.TOKEN 相同">
        <span class="hint">固定不變的碼，只能防隨手亂打。已用輪替密語就不需要這個。</span>
      </label>
    </div>

    <div class="panel qrbox">
      <div id="qr"></div>
      <div id="rotate" class="rotate" hidden>
        <div class="bar"><i id="bar"></i></div>
        <span id="countdown">30 秒後更換</span>
      </div>
      <div id="static" class="static-note">固定網址模式 —— 學生可截圖轉傳給沒到的同學</div>
      <div class="url" id="url"></div>
      <div class="btns">
        <button id="copy">複製網址</button>
        <button id="full" class="primary">投影全螢幕</button>
      </div>
    </div>
  </div>
</div>

<div id="project">
  <h2 id="pTitle">課堂點名</h2>
  <div id="projectQr"></div>
  <div id="pRotate" class="p-rotate" hidden>
    <div class="bar"><i id="pBar"></i></div>
    <span id="pCountdown"></span>
  </div>
  <p id="pSub">請用手機相機掃描，輸入學號與姓名完成簽到</p>
  <button class="close" id="exit">關閉（Esc）</button>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  'use strict';
  var CFG = window.APP_CONFIG || {};
  var $ = function(id){ return document.getElementById(id); };

  var LABEL = { attendance:'課堂點名', classBonus:'課堂加分', lectureBonus:'講座加分' };
  var SUB = {
    attendance:'請用手機相機掃描，輸入學號與姓名完成簽到',
    classBonus:'請用手機相機掃描，登記本次課堂加分',
    lectureBonus:'請用手機相機掃描，登記本次講座加分'
  };

  // 必須與 Code.gs 的 CONFIG.ROTATE_PERIOD_SEC / ROTATE_CODE_LEN 相同
  var PERIOD = 30;
  var CODE_LEN = 10;
  var SECRET_KEY = 'qr-teacher.secret';

  // 推導學生端網址：拿掉檔名與查詢字串。
  // Vercel 的 cleanUrls 會把 /qr.html 轉成 /qr，兩種都要能處理。
  function siteBase() {
    if (CFG.SITE_URL) return CFG.SITE_URL;
    var u = new URL(location.href);
    u.search = ''; u.hash = '';
    u.pathname = u.pathname.replace(/\/qr(\.html)?$/, '/');
    if (!/\/$/.test(u.pathname)) u.pathname += '/';
    return u.toString();
  }
  $('site').value = siteBase();

  // 密語只留在這台電腦，絕不進網址、絕不上傳
  try { $('secret').value = localStorage.getItem(SECRET_KEY) || ''; } catch (e) {}
  function rememberSecret(){
    try {
      var v = $('secret').value.trim();
      if (v) localStorage.setItem(SECRET_KEY, v); else localStorage.removeItem(SECRET_KEY);
    } catch (e) {}
  }

  /* ---------- 輪替碼 ---------- */

  function hmacHex(secret, msg){
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey('raw', enc.encode(secret), { name:'HMAC', hash:'SHA-256' }, false, ['sign'])
      .then(function(key){ return crypto.subtle.sign('HMAC', key, enc.encode(msg)); })
      .then(function(sig){
        var out = '', b = new Uint8Array(sig);
        for (var i = 0; i < b.length; i++) {
          var h = b[i].toString(16);
          out += (h.length === 1 ? '0' : '') + h;
        }
        return out;
      });
  }

  function slotNow(){ return Math.floor(Date.now() / 1000 / PERIOD); }
  function secsLeft(){ return PERIOD - (Date.now() / 1000) % PERIOD; }

  /* ---------- 組網址 ---------- */

  function buildUrl(slot){
    var site = $('site').value.trim() || siteBase();
    var mode = $('mode').value;
    var u;
    try { u = new URL(site, location.href); }
    catch (e) { return Promise.resolve(site); }

    u.searchParams.set('mode', mode);

    var sess = $('session').value.trim();
    if (sess) u.searchParams.set('session', sess);

    var pts = parseInt($('points').value, 10);
    if (mode !== 'attendance' && pts > 1) u.searchParams.set('points', String(Math.min(pts, 10)));

    var tok = $('token').value.trim();
    if (tok) u.searchParams.set('token', tok);

    var secret = $('secret').value.trim();
    if (!secret) return Promise.resolve(u.toString());

    return hmacHex(secret, mode + '|' + sess + '|' + slot).then(function(hex){
      u.searchParams.set('s', String(slot));
      u.searchParams.set('c', hex.slice(0, CODE_LEN));
      return u.toString();
    });
  }

  /* ---------- 繪製 ---------- */

  function draw(el, url, size){
    el.innerHTML = '';
    new QRCode(el, { text:url, width:size, height:size, correctLevel:QRCode.CorrectLevel.M });
  }
  function projecting(){ return $('project').classList.contains('on'); }
  function bigSize(){ return Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.46); }

  var lastUrl = '', lastSlot = -1, busy = false;

  function render(force){
    if (busy) return;
    busy = true;
    var slot = slotNow();
    buildUrl(slot).then(function(url){
      if (url !== lastUrl || force) {
        lastUrl = url; lastSlot = slot;
        $('url').textContent = url;
        draw($('qr'), url, 240);
        if (projecting()) draw($('projectQr'), url, bigSize());
      }
      var mode = $('mode').value;
      $('pTitle').textContent = LABEL[mode];
      $('pSub').textContent = SUB[mode];
      paintRotateState();
    }).catch(function(err){
      $('url').textContent = '產生失敗：' + (err && err.message || err);
    }).then(function(){ busy = false; });
  }

  function paintRotateState(){
    var on = !!$('secret').value.trim();
    $('rotate').hidden = !on;
    $('static').hidden = on;
    $('pRotate').hidden = !on;
  }

  function tick(){
    if (!$('secret').value.trim()) return;
    if (slotNow() !== lastSlot) { render(); return; }

    var left = secsLeft();
    var pct = (left / PERIOD) * 100;
    var txt = Math.ceil(left) + ' 秒後更換';
    $('bar').style.width = pct + '%';
    $('countdown').textContent = txt;
    if (projecting()) {
      $('pBar').style.width = pct + '%';
      $('pCountdown').textContent = txt;
    }
  }

  /* ---------- 事件 ---------- */

  ['mode','site','session','points','token','secret'].forEach(function(id){
    $(id).addEventListener('input', function(){
      if (id === 'secret') rememberSecret();
      render(true);
    });
    $(id).addEventListener('change', function(){ render(true); });
  });

  $('copy').addEventListener('click', function(){
    var btn = this;
    var note = $('secret').value.trim() ? '已複製（此網址 30 秒後失效）' : '已複製 ✓';
    navigator.clipboard.writeText(lastUrl).then(function(){
      btn.textContent = note;
      setTimeout(function(){ btn.textContent = '複製網址'; }, 2000);
    }).catch(function(){
      btn.textContent = '請手動複製下方網址';
      setTimeout(function(){ btn.textContent = '複製網址'; }, 2000);
    });
  });

  function openProject(){
    $('project').classList.add('on');
    draw($('projectQr'), lastUrl, bigSize());
    paintRotateState();
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function(){});
    }
  }
  function closeProject(){
    $('project').classList.remove('on');
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
  }

  $('full').addEventListener('click', openProject);
  $('exit').addEventListener('click', closeProject);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeProject(); });
  window.addEventListener('resize', function(){ if (projecting()) draw($('projectQr'), lastUrl, bigSize()); });

  render(true);
  setInterval(tick, 250);
})();
</script>
</body>
</html>
